[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocfr-uie"
version = "1.0.0"
description = "Optically conditioned frequency reconstruction for underwater image enhancement"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=9.5",
  "scikit-image>=0.21",
  "scipy>=1.10",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
iqa = ["pyiqa==0.1.15.post2"]

[tool.setuptools.packages.find]
include = ["ocfr_uie*"]
